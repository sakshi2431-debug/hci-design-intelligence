name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_repo.py
      - run: python3 scripts/package_skill.py
      - run: python3 scripts/build_generic_bundle.py
      - run: python3 scripts/build_generic_bundle.py --profile ai
      - run: python3 scripts/eval_suite.py prepare
      - run: python3 scripts/package_repository.py
